<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CodeMode</title>
<style>
  :root {
    --bg: #0a0b0e;
    --panel: #101218;
    --panel-2: #161922;
    --line: #232734;
    --text: #e7e9f0;
    --dim: #8d93a6;
    --dim-2: #626879;
    --accent: #8b7cff;
    --accent-soft: #1e1b3a;
    --ok: #49c98b;
    --warn: #e8b45c;
    --bad: #ef6f6f;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 244px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    padding: 16px 16px 10px;
    font-weight: 650; letter-spacing: .2px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); align-self: center; }
  .brand small { color: var(--dim-2); font-weight: 500; font-size: 11px; }
  .new {
    margin: 4px 12px 10px; padding: 9px 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    font: inherit; font-weight: 550; cursor: pointer; text-align: left;
  }
  .new:hover { border-color: #333a4d; background: #1b1f2a; }
  .convs { flex: 1; overflow-y: auto; padding: 4px 8px 8px; min-height: 0; }
  .conv {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    color: var(--dim); font-size: 13.5px;
  }
  .conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv:hover { background: #171a23; color: var(--text); }
  .conv.on { background: var(--accent-soft); color: #cdc7ff; }
  .conv .x { opacity: 0; border: 0; background: none; color: var(--dim-2); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; }
  .conv:hover .x { opacity: 1; }
  .conv .x:hover { color: var(--bad); }
  .side-foot { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
  .ram { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); }
  .ram b { color: var(--dim); font-weight: 600; }
  .ghost {
    background: none; border: 1px solid var(--line); color: var(--dim);
    padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: #333a4d; }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: rgba(16,18,24,.86); backdrop-filter: blur(8px);
  }
  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: none; color: var(--dim);
    padding: 6px 16px; border-radius: 7px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #100e22; }
  .seg button:not(.on):hover { color: var(--text); }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; font: inherit; font-size: 13px; max-width: 260px;
  }
  .grow { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--dim); font-family: var(--mono);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; white-space: nowrap;
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim-2); display: inline-block; }
  .chip.ok i { background: var(--ok); box-shadow: 0 0 8px #49c98b66; }
  .chip.warn i { background: var(--warn); }

  .hint {
    padding: 7px 18px; font-size: 12px; color: var(--dim-2);
    border-bottom: 1px solid var(--line); background: #0c0e12;
    display: flex; gap: 10px; align-items: center;
  }
  .hint b { color: var(--accent); font-weight: 600; }

  .thread { flex: 1; overflow-y: auto; padding: 22px 18px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 18px; }

  .msg { display: grid; gap: 6px; }
  .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim-2); font-weight: 700; }
  .msg.user .who { color: #7f8ba8; }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 14px; white-space: pre-wrap;
  }
  .body p { margin: 0 0 9px; }
  .body p:last-child { margin-bottom: 0; }
  .body h3, .body h4 { margin: 14px 0 7px; font-size: 15px; }
  .body ul { margin: 0 0 9px; padding-left: 20px; }
  .body li { margin: 2px 0; }
  .body code.ic {
    font-family: var(--mono); font-size: 12.5px;
    background: #1b1f2a; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }
  .fence { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 10px 0; background: #0c0e13; }
  .fhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: #13161d; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--dim-2); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em;
  }
  .copy { background: none; border: 0; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; padding: 2px 6px; border-radius: 5px; }
  .copy:hover { color: var(--text); background: #1f2430; }
  .fence pre { margin: 0; padding: 12px; overflow-x: auto; }
  .fence code { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }

  .empty { max-width: 560px; margin: 6vh auto; text-align: center; color: var(--dim); }
  .empty h1 { font-size: 22px; color: var(--text); margin: 0 0 6px; font-weight: 650; }
  .empty p { margin: 0 0 16px; font-size: 14px; }
  .card {
    text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin: 0 0 12px;
  }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--text); font-weight: 650; }
  .card p { font-size: 13px; margin: 0 0 8px; }
  .card pre {
    background: #0c0e13; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: var(--mono); font-size: 12.5px; color: #b9c0d4;
    overflow-x: auto; margin: 6px 0;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .mdl { font-size: 12px; color: var(--dim-2); font-family: var(--mono); }

  .composer { border-top: 1px solid var(--line); padding: 12px 18px 16px; background: var(--panel); }
  .inputrow {
    max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px;
  }
  .inputrow:focus-within { border-color: #3b3560; box-shadow: 0 0 0 3px #8b7cff18; }
  textarea {
    flex: 1; background: none; border: 0; color: var(--text); font: inherit;
    resize: none; outline: none; max-height: 190px; padding: 6px 0; min-height: 24px;
  }
  .send {
    background: var(--accent); color: #100e22; border: 0; border-radius: 10px;
    padding: 9px 16px; font: inherit; font-weight: 650; cursor: pointer;
  }
  .send:disabled { background: #2a2740; color: var(--dim-2); cursor: default; }
  .stop { background: #3a2226; color: #ffb0b0; border: 1px solid #5a2f36; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .foot { max-width: 780px; margin: 7px auto 0; display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); }

  .err { color: #ffb3b3; background: #2a1a1d; border: 1px solid #522c33; border-radius: 9px; padding: 9px 12px; font-size: 13px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #23283a; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- updates ---------- */
  .upd { position: relative; }
  .upd .badge {
    background: var(--accent); color: #100e22; border-radius: 9px;
    padding: 1px 6px; margin-left: 6px; font-size: 10.5px; font-weight: 700;
  }
  .scrim {
    position: fixed; inset: 0; background: #05060ad9; z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .scrim[hidden] { display: none; }
  .panel {
    width: min(700px, 100%); max-height: 84vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 24px 60px #000a; overflow: hidden;
  }
  .phead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .phead b { font-size: 15px; }
  .pbody { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 9px; }
  .urow {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 13px;
  }
  .urow > div:first-child { min-width: 0; }
  .urow b { font-size: 13.5px; }
  .urow .mdl { margin-top: 2px; }
  .uact { display: flex; gap: 7px; flex-shrink: 0; }
  .uact .send { padding: 7px 12px; font-size: 12.5px; }
  .uact .ghost { padding: 6px 11px; font-size: 12.5px; }
  .games {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 400px;
  }
  pre.winget {
    background: #0c0e13; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-family: var(--mono); font-size: 11px; color: #aeb6cc;
    overflow-x: auto; margin: 0; white-space: pre;
  }
  .note { font-size: 12px; color: var(--dim-2); line-height: 1.6; margin: 2px 0 0; }
  .note b { color: var(--dim); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 68px 1fr; }
    .brand small, .conv span, .side-foot .ghost, .ram { display: none; }
    .brand { justify-content: center; padding: 14px 0 8px; }
    .conv { justify-content: center; }
    .new { text-align: center; padding: 9px 0; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i class="dot"></i>CodeMode <small id="ver"></small></div>
    <button class="new" id="newChat">+ New chat</button>
    <div class="convs" id="convs"></div>
    <div class="side-foot">
      <button class="ghost" id="trimBtn" title="Free RAM: stop OneDrive/launchers, drop transparency and animations. Xbox and Armoury are untouched.">Trim system for Code Mode</button>
      <div class="ram" id="ram">memory …</div>
    </div>
  </aside>

  <main>
    <header>
      <div class="seg" id="seg">
        <button data-mode="chat">Chat</button>
        <button data-mode="code" class="on">Code</button>
      </div>
      <select id="model"><option value="">detecting models…</option></select>
      <div class="grow"></div>
      <button class="ghost upd" id="updBtn">Updates</button>
      <div class="chip" id="statusChip"><i></i><span>checking</span></div>
    </header>
    <div class="hint" id="hint"></div>

    <section class="thread" id="thread"></section>

    <footer class="composer">
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="Ask, paste an error, or drop a snippet…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="send" id="send">Send</button>
        <button class="stop" id="stop" hidden>Stop</button>
      </div>
      <div class="foot">
        <span id="stat"></span><span class="grow"></span><span id="footNote"></span>
      </div>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="panel" role="dialog" aria-label="Updates">
    <div class="phead">
      <b>Updates</b>
      <button class="ghost" id="updClose">Close</button>
    </div>
    <div class="pbody" id="updBody"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const KEY = "codemode.v1";

let CFG = { modes: {} };
let STATUS = { backends: [], memory: {}, recommended: [] };
let STATE = { mode: "code", model: "", backend: "", convs: [], activeId: null };
let streaming = false;
let controller = null;

/* ---------------- persistence ---------------- */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) Object.assign(STATE, JSON.parse(raw));
  } catch (e) { /* ignore corrupt state */ }
  if (!Array.isArray(STATE.convs) || !STATE.convs.length) {
    STATE.convs = [newConv()];
    STATE.activeId = STATE.convs[0].id;
  }
  if (!STATE.convs.find((c) => c.id === STATE.activeId)) STATE.activeId = STATE.convs[0].id;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) { /* full/blocked */ }
}
function newConv() {
  return { id: "c" + Math.random().toString(36).slice(2, 9), title: "New chat", messages: [], at: Date.now() };
}
function active() { return STATE.convs.find((c) => c.id === STATE.activeId); }

/* ---------------- markdown (small, escape-first) ---------------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fenceHTML(lang, code) {
  const tag = esc(lang || "code");
  return '<div class="fence"><div class="fhead"><span>' + tag + '</span>' +
    '<button class="copy" data-code="' + encodeURIComponent(code) + '">copy</button></div>' +
    '<pre><code>' + esc(code) + '</code></pre></div>';
}
function md(src) {
  const blocks = [];
  let s = esc(src);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push(fenceHTML(lang, code.replace(/\n+$/, "")));
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });
  s = s.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  s = s.replace(/^#{1,3}\s+(.+)$/gm, "<h3>$1</h3>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|\n)((?:[-*]\s+[^\n]*(?:\n|$))+)/g, (m, pre, list) => {
    const items = list.trim().split(/\n/).map((l) => "<li>" + l.replace(/^[-*]\s+/, "") + "</li>").join("");
    return pre + "<ul>" + items + "</ul>";
  });
  s = s.replace(/\u0000B(\d+)\u0000(?=\n|$)/g, (m, i) => "\n" + blocks[Number(i)] + "\n");
  s = s.split(/\n{2,}/).map((p) => {
    const t = p.trim();
    if (!t) return "";
    if (/^<(ul|h3|div|pre|p)/.test(t)) return t;
    return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return s.replace(/\u0000B(\d+)\u0000/g, (m, i) => blocks[Number(i)]);
}

/* ---------------- rendering ---------------- */
function renderSide() {
  const box = $("#convs");
  box.innerHTML = "";
  [...STATE.convs].sort((a, b) => b.at - a.at).forEach((c) => {
    const el = document.createElement("div");
    el.className = "conv" + (c.id === STATE.activeId ? " on" : "");
    el.innerHTML = '<span>' + esc(c.title) + '</span><button class="x" title="delete">×</button>';
    el.onclick = (e) => {
      if (e.target.classList.contains("x")) {
        e.stopPropagation();
        STATE.convs = STATE.convs.filter((k) => k.id !== c.id);
        if (!STATE.convs.length) STATE.convs = [newConv()];
        if (!STATE.convs.find((k) => k.id === STATE.activeId)) STATE.activeId = STATE.convs[0].id;
        save(); renderAll();
        return;
      }
      STATE.activeId = c.id; save(); renderAll();
    };
    box.appendChild(el);
  });
}

function renderHeader() {
  document.querySelectorAll("#seg button").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === STATE.mode);
  });
  const sel = $("#model");
  const models = [];
  (STATUS.backends || []).forEach((b) => b.models.forEach((m) => models.push({ m, kind: b.kind })));
  sel.innerHTML = "";
  if (!models.length) {
    sel.innerHTML = '<option value="">no model installed</option>';
  } else {
    models.forEach(({ m, kind }) => {
      const o = document.createElement("option");
      o.value = m; o.textContent = m + (kind === "lmstudio" ? "  (LM Studio)" : "");
      if (m === STATE.model) o.selected = true;
      sel.appendChild(o);
    });
    if (!models.find((x) => x.m === STATE.model)) {
      const pref = models.find((x) => /coder/i.test(x.m)) || models[0];
      STATE.model = pref.m; STATE.backend = pref.kind;
      sel.value = STATE.model;
      save();
    }
  }
  const chip = $("#statusChip");
  const live = (STATUS.backends || []).filter((b) => b.models.length);
  if (live.length) {
    chip.className = "chip ok";
    chip.innerHTML = "<i></i><span>" + live.map((b) => b.label + " · " + b.models.length).join(" + ") + "</span>";
  } else {
    chip.className = "chip warn";
    chip.innerHTML = "<i></i><span>no local runtime</span>";
  }
  const mem = STATUS.memory || {};
  if (mem.avail_gb !== undefined) {
    $("#ram").innerHTML = "free <b>" + mem.avail_gb.toFixed(1) + " GB</b> / " + mem.total_gb.toFixed(1) + " GB";
  }
  const cfg = (CFG.modes || {})[STATE.mode] || {};
  $("#hint").innerHTML = "<b>" + esc(cfg.label || STATE.mode) + "</b> " + esc(cfg.hint || "") +
    ' <span class="mdl">ctx ' + (cfg.num_ctx || "?") + " · temp " + (cfg.temperature ?? "?") +
    " · max " + (cfg.num_predict || "?") + " tok</span>";
  $("#ver").textContent = "v0.1";
}

function emptyHTML() {
  const live = (STATUS.backends || []).filter((b) => b.models.length);
  if (live.length) {
    return '<div class="empty"><h1>Code Mode ready</h1>' +
      '<p>' + esc(STATE.model || "a model") + ' on ' + esc(live[0].label) +
      '. Switch to Chat for a general assistant; Code keeps the history trimmed to 8k.</p></div>';
  }
  const rec = (STATUS.recommended || []).map((r) =>
    '<div class="mdl">' + esc(r.name) + " — " + esc(r.download) + " (" + esc(r.note) + ")</div>").join("");
  return '<div class="empty">' +
    '<h1>No local model yet</h1>' +
    '<p>CodeMode talks to whichever runtime you install. Pick one below, then press Recheck.</p>' +
    '<div class="card"><h2>Option A — Ollama (smallest install)</h2>' +
    '<pre>winget install Ollama.Ollama\nollama pull qwen2.5-coder:3b</pre>' +
    '<p>Runs CPU-only by default and now ships an experimental Vulkan backend for your Radeon iGPU.</p></div>' +
    '<div class="card"><h2>Option B — LM Studio (Vulkan GPU offload, easier tuning)</h2>' +
    '<pre>winget install ElementLabs.LMStudio</pre>' +
    '<p>Start its Local Server on port 1234, load a coder model, then Recheck.</p></div>' +
    '<div class="card"><h2>Sizes that fit 16 GB shared RAM</h2>' + rec + '</div>' +
    '<div class="row" style="justify-content:center"><button class="ghost" id="recheck">Recheck runtimes</button></div>' +
    '</div>';
}

function renderThread() {
  const c = active();
  const box = $("#thread");
  if (!c || !c.messages.length) { box.innerHTML = emptyHTML(); bindEmpty(); return; }
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  c.messages.forEach((m) => {
    const el = document.createElement("div");
    el.className = "msg " + m.role;
    el.innerHTML = '<div class="who">' + (m.role === "user" ? "you" : "codemode") + '</div>' +
      '<div class="body">' + (m.role === "user" ? esc(m.content) : md(m.content)) + "</div>";
    wrap.appendChild(el);
  });
  box.innerHTML = "";
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

function bindEmpty() {
  const r = $("#recheck");
  if (r) r.onclick = () => refreshStatus(true);
}

function renderAll() { renderSide(); renderHeader(); renderThread(); save(); }

/* ---------------- status ---------------- */
async function refreshStatus(force) {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    STATUS = await r.json();
  } catch (e) { return; }
  renderHeader();
  if (force || !active() || !active().messages.length) renderThread();
}

/* ---------------- chat ---------------- */
function setBusy(b) {
  streaming = b;
  $("#send").disabled = b;
  $("#send").hidden = b;
  $("#stop").hidden = !b;
}

async function send() {
  const c = active();
  const text = $("#input").value.trim();
  if (!c || !text || streaming) return;
  if (!STATE.model) { refreshStatus(true); return; }

  c.messages.push({ role: "user", content: text });
  if (c.title === "New chat") c.title = text.slice(0, 42).replace(/\s+/g, " ") || "New chat";
  c.at = Date.now();
  $("#input").value = "";
  autoGrow();
  renderSide(); renderThread();
  save();

  const box = $("#thread");
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = '<div class="who">codemode</div><div class="body"><span class="cursor"></span></div>';
  (box.querySelector(".wrap") || box).appendChild(el);
  const body = el.querySelector(".body");
  box.scrollTop = box.scrollHeight;

  controller = new AbortController();
  setBusy(true);
  $("#stat").textContent = "";

  let out = "";
  let first = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        mode: STATE.mode,
        model: STATE.model,
        backend: STATE.backend,
        messages: c.messages.map((m) => ({ role: m.role, content: m.content })),
      }),
    });

    if (!res.ok) {
      let msg = "request failed (" + res.status + ")";
      try { const j = await res.json(); msg = j.error + (j.detail ? " — " + j.detail : ""); } catch (e) {}
      body.innerHTML = '<div class="err">' + esc(msg) + "</div>";
      setBusy(false);
      // refresh header/model list only - re-rendering the thread would wipe the error
      refreshStatus(false);
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    const paint = () => {
      body.innerHTML = md(out) + (streaming ? '<span class="cursor"></span>' : "");
      box.scrollTop = box.scrollHeight;
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!chunk.startsWith("data:")) continue;
        let ev;
        try { ev = JSON.parse(chunk.slice(5).trim()); } catch (e) { continue; }
        if (ev.delta) {
          if (first) { first = false; }
          out += ev.delta;
          if (out.length % 24 < ev.delta.length) paint();
        }
        if (ev.error) out += (out ? "\n\n" : "") + "⚠ " + ev.error;
        if (ev.done) {
          $("#stat").textContent =
            ev.chars + " chars · " + ev.seconds + "s · ~" + ev.tps_est + " tok/s est";
        }
      }
    }
    paint();
    if (out.trim()) {
      c.messages.push({ role: "assistant", content: out });
      c.at = Date.now();
      save();
    }
  } catch (e) {
    if (e.name === "AbortError") {
      if (out.trim()) { c.messages.push({ role: "assistant", content: out }); save(); }
      body.innerHTML = md(out) + '<div class="mdl">stopped</div>';
    } else {
      body.innerHTML = '<div class="err">' + esc(e.message) + "</div>";
    }
  } finally {
    setBusy(false);
    if (!out.trim() && !body.querySelector(".err")) body.innerHTML = '<div class="mdl">no output</div>';
    renderHeader();
  }
}

/* ---------------- events ---------------- */
function autoGrow() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 190) + "px";
}

$("#input").addEventListener("input", autoGrow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#send").onclick = send;
$("#stop").onclick = () => { if (controller) controller.abort(); };
$("#newChat").onclick = () => {
  const c = newConv();
  STATE.convs.push(c);
  STATE.activeId = c.id;
  renderAll();
  $("#input").focus();
};
document.querySelectorAll("#seg button").forEach((b) => {
  b.onclick = () => { STATE.mode = b.dataset.mode; save(); renderHeader(); };
});
$("#model").onchange = (e) => {
  STATE.model = e.target.value;
  const found = (STATUS.backends || []).find((x) => x.models.includes(STATE.model));
  STATE.backend = found ? found.kind : STATE.backend;
  save();
};
$("#trimBtn").onclick = async () => {
  const btn = $("#trimBtn");
  btn.disabled = true;
  btn.textContent = "trimming…";
  try {
    const r = await fetch("/api/system/trim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "code" }),
    });
    const j = await r.json();
    $("#stat").textContent = (j.output || j.error || "done").split("\n").slice(-1)[0];
  } catch (e) {
    $("#stat").textContent = "trim failed: " + e.message;
  }
  btn.disabled = false;
  btn.textContent = "Trim system for Code Mode";
  refreshStatus();
};
$("#thread").addEventListener("click", (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard.writeText(decodeURIComponent(b.dataset.code || "")).then(() => {
    b.textContent = "copied";
    setTimeout(() => (b.textContent = "copy"), 1200);
  });
});

/* ---------------- updates ---------------- */
function badge(j) {
  const n = (j.winget && j.winget.count) || 0;
  $("#updBtn").innerHTML = "Updates" + (n ? '<span class="badge">' + n + "</span>" : "");
}

async function openUpdates() {
  $("#scrim").hidden = false;
  $("#updBody").innerHTML = '<div class="mdl">reading install manifests…</div>';
  try {
    const j = await (await fetch("/api/updates", { cache: "no-store" })).json();
    renderUpdates(j);
    badge(j);
  } catch (e) {
    $("#updBody").innerHTML = '<div class="err">' + esc(e.message) + "</div>";
  }
}

function urow(title, sub, target, present, label) {
  return '<div class="urow"><div><b>' + esc(title) + '</b><div class="mdl games">' + esc(sub) +
    '</div></div><div class="uact">' +
    (present ? '<button class="ghost" data-act="open:' + target + '">' + esc(label || "Open") + "</button>" : "") +
    "</div></div>";
}

function renderUpdates(j) {
  const w = j.winget || {}, steam = j.steam || {}, epic = j.epic || {};
  const xbox = j.xbox || {}, bnet = j.battlenet || {};
  const rows = [];

  rows.push('<div class="urow"><div><b>Windows apps</b><div class="mdl">winget · ' +
    (w.count ? w.count + " upgrade(s) available" : (w.at ? "everything up to date" : "not scanned yet")) +
    (w.at ? " · " + new Date(w.at * 1000).toLocaleTimeString() : "") +
    (w.error ? " · " + esc(w.error) : "") +
    '</div></div><div class="uact"><button class="ghost" data-act="scan">Scan</button>' +
    '<button class="send" data-act="apply"' + (w.count ? "" : " disabled") + ">Update all</button></div></div>");
  if (w.rows && w.rows.length) rows.push('<pre class="winget">' + esc(w.rows.join("\n")) + "</pre>");

  rows.push(urow("Xbox / Game Pass",
    (xbox.games || []).length
      ? xbox.games.length + " games · " + xbox.games.join(", ")
      : "no games found in C:\\XboxGames",
    "store", true, "Check Store updates"));
  rows.push(urow("Steam",
    (steam.games || []).length
      ? steam.games.length + " · " + steam.games.map((g) => g.name).join(", ")
      : "no games installed",
    "steam", !!steam.present, "Open updater"));
  rows.push(urow("Epic",
    (epic.games || []).length
      ? epic.games.length + " · " + epic.games.map((g) => g.name).join(", ")
      : "no games found",
    "epic", !!epic.present, "Open updater"));
  rows.push(urow("Battle.net", bnet.present ? "installed" : "not installed",
    "battlenet", !!bnet.present, "Open updater"));

  rows.push('<p class="note"><b>Why a button instead of autostart:</b> Steam, Epic, Battle.net and the Store ' +
    'update games <i>when they run</i>. Starting them at login only moves that check earlier — it is not what ' +
    'keeps games current. Opening one from here does the same job on demand, and nothing stays resident after.</p>');
  rows.push('<p class="note"><b>What is real here:</b> winget is an actual CLI, so Scan and Update all really run. ' +
    'None of the four storefronts exposes a supported headless \u201cupdate everything\u201d call, so those buttons ' +
    'open the launcher rather than pretending to drive it.</p>');

  $("#updBody").innerHTML = rows.join("");
}

$("#updBtn").onclick = openUpdates;
$("#updClose").onclick = () => { $("#scrim").hidden = true; };
$("#scrim").addEventListener("click", (e) => {
  if (e.target.id === "scrim") $("#scrim").hidden = true;
});
$("#updBody").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  try {
    if (act === "scan") {
      b.disabled = true;
      b.textContent = "scanning…";
      await fetch("/api/updates/scan", { method: "POST" });
      await openUpdates();
    } else if (act === "apply") {
      if (!confirm("Run 'winget upgrade --all' now? This updates every app winget manages, silently.")) return;
      b.disabled = true;
      b.textContent = "updating…";
      const r = await fetch("/api/updates/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target: "winget" }),
      });
      const out = await r.json();
      $("#updBody").insertAdjacentHTML("afterbegin",
        '<pre class="winget">' + esc(out.output || out.error || "done") + "</pre>");
      b.textContent = "Update all";
      b.disabled = false;
    } else if (act.indexOf("open:") === 0) {
      b.disabled = true;
      b.textContent = "opening…";
      await fetch("/api/updates/open", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target: act.slice(5) }),
      });
      b.disabled = false;
      b.textContent = "Open updater";
    }
  } catch (err) {
    b.disabled = false;
    b.textContent = "retry";
  }
});

/* ---------------- boot ---------------- */
(async function boot() {
  load();
  try { CFG = await (await fetch("/api/config")).json(); } catch (e) {}
  renderAll();
  await refreshStatus(true);
  fetch("/api/updates").then((r) => r.json()).then(badge).catch(() => {});
  $("#input").focus();
  setInterval(() => refreshStatus(false), 10000);
})();
</script>
</body>
</html>
